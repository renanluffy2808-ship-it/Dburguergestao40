services:
  - type: web
    name: dburger-gestao
    env: node
    plan: free
    region: ohio
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: dburger-postgres
          property: connectionString

databases:
  - name: dburger-postgres
    plan: free
    region: ohio
    databaseName: dburger
    user: dburger
