
name: Build APK D Burger

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'src/**'
      - 'package.json'
      - 'build.gradle.kts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Gradle compatível
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Instalar dependências web
        run: npm install --no-audit --no-fund

      - name: Compilar projeto web
        run: npm run build

      - name: Criar ícone Android ausente
        run: |
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/app_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#FF7A00"
                  android:pathData="M0,0h48v48h-48z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M8,19 C8,13 14,10 24,10 C34,10 40,13 40,19 Z M8,23h32v5h-32z M11,31h26 C35,37 29,39 24,39 C19,39 13,37 11,31z"/>
          </vector>
          EOF
          
      - name: Gerar APK
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DBurger-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
